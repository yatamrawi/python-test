<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Destroyer Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --real-red: #d21f3c;
        --real-gold: #f7c948;
        --blue: #0b3d91;
        --bg: #071a36;
        --panel: rgba(14, 25, 45, 0.88);
        --text: #f4f8ff;
        --accent: #7be0ff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Nunito", sans-serif;
        background: radial-gradient(circle at top, #123d7a 0%, var(--bg) 45%, #040d1c 100%);
        color: var(--text);
      }

      .page {
        width: min(1000px, calc(100% - 24px));
        margin: 32px auto;
        padding: 24px;
        background: var(--panel);
        border: 3px solid rgba(123, 224, 255, 0.2);
        border-radius: 24px;
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.32);
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-family: "Baloo 2", cursive;
        font-size: clamp(2.2rem, 5vw, 3.4rem);
        color: white;
      }

      .scoreboard {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .pill {
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        font-weight: 800;
      }

      .game-shell {
        display: grid;
        gap: 18px;
      }

      .game-screen {
        position: relative;
        width: 100%;
        height: 520px;
        border-radius: 22px;
        overflow: hidden;
        background: linear-gradient(180deg, #0e2e57 0%, #0a1730 42%, #060d1c 100%);
        border: 3px solid rgba(247, 201, 73, 0.35);
      }

      .skyline {
        position: absolute;
        inset: auto 0 0 0;
        height: 30%;
        background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(0,0,0,0.2));
      }

      .stars {
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(circle, rgba(255,255,255,0.8) 1px, transparent 1.5px),
          radial-gradient(circle, rgba(123,224,255,0.8) 1px, transparent 1.5px),
          radial-gradient(circle, rgba(247,201,73,0.8) 1px, transparent 1.5px);
        background-position: 18px 30px, 120px 70px, 240px 42px;
        background-size: 180px 180px;
        opacity: 0.7;
      }

      .ship,
      .enemy,
      .missile,
      .explosion {
        position: absolute;
        display: block;
      }

      .ship {
        width: 52px;
        height: 28px;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(180deg, #d8ebff, #7be0ff 50%, #1d6db7);
        clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
        border-radius: 8px 8px 0 0;
        box-shadow: 0 0 18px rgba(123,224,255,0.7);
      }

      .ship::before {
        content: "";
        position: absolute;
        left: 50%;
        top: -12px;
        width: 10px;
        height: 18px;
        background: var(--real-gold);
        transform: translateX(-50%);
        clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      }

      .enemy {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #f7c948, #d21f3c 55%, #75071f);
        box-shadow: inset 0 0 10px rgba(255,255,255,0.3);
      }

      .enemy::before {
        content: "";
        position: absolute;
        inset: 10px 12px auto 12px;
        height: 8px;
        border-radius: 999px;
        background: rgba(255,255,255,0.85);
      }

      .missile {
        width: 6px;
        height: 18px;
        border-radius: 8px;
        background: linear-gradient(180deg, #fff, var(--real-gold));
        box-shadow: 0 0 14px rgba(247,201,73,0.8);
      }

      .explosion {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: radial-gradient(circle, #fffef5 0%, #f7c948 25%, #d21f3c 60%, rgba(210,31,60,0) 70%);
        animation: pop 0.35s ease-out forwards;
      }

      @keyframes pop {
        0% { transform: scale(0.4); opacity: 1; }
        100% { transform: scale(2.3); opacity: 0; }
      }

      .controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .buttons {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      button,
      a.button {
        appearance: none;
        border: none;
        padding: 12px 18px;
        border-radius: 12px;
        font-weight: 800;
        font-family: "Nunito", sans-serif;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.2s ease;
      }

      button:hover,
      a.button:hover {
        transform: translateY(-2px);
      }

      .start {
        background: linear-gradient(135deg, var(--real-red), var(--real-gold));
        color: white;
      }

      .home {
        background: rgba(255,255,255,0.08);
        color: white;
        border: 1px solid rgba(255,255,255,0.12);
      }

      .message {
        color: var(--accent);
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <h1>Destroyer Game</h1>
        <div class="scoreboard">
          <div class="pill">Score: <span id="score">0</span></div>
          <div class="pill">Lives: <span id="lives">3</span></div>
          <div class="pill">Power: <span id="powerLevel">1</span></div>
        </div>
      </div>

      <div class="game-shell">
        <div id="gameArea" class="game-screen" aria-label="Destroyer game area">
          <div class="stars"></div>
          <div class="skyline"></div>
          <div id="ship" class="ship" aria-label="Player ship"></div>
        </div>

        <div class="controls">
          <div class="buttons">
            <button id="startButton" class="start">Start Game</button>
            <a class="button home" href="index.html">Back to Home</a>
          </div>
          <div id="message" class="message">Press Start to begin.</div>
        </div>
      </div>
    </div>

    <script>
      const gameArea = document.getElementById('gameArea');
      const ship = document.getElementById('ship');
      const scoreEl = document.getElementById('score');
      const livesEl = document.getElementById('lives');
      const powerEl = document.getElementById('powerLevel');
      const messageEl = document.getElementById('message');
      const startButton = document.getElementById('startButton');

      let score = 0;
      let lives = 3;
      let gameRunning = false;
      let shipX = 0;
      let moveLeft = false;
      let moveRight = false;
      let fireHeld = false;
      let fireCooldown = 0;
      let missiles = [];
      let enemies = [];
      let explosions = [];
      let lastTime = 0;
      let enemyTimer = 0;
      let animationId = null;

      function getPowerLevel() {
        if (score >= 150) return 4;
        if (score >= 90) return 3;
        if (score >= 40) return 2;
        return 1;
      }

      function updateShipPower() {
        const level = getPowerLevel();
        powerEl.textContent = level;
        ship.style.width = `${52 + (level - 1) * 10}px`;
        ship.style.height = `${28 + (level - 1) * 5}px`;
        ship.style.filter = level >= 3 ? 'drop-shadow(0 0 18px rgba(123,224,255,0.9))' : 'drop-shadow(0 0 10px rgba(123,224,255,0.7))';
        ship.style.background = level >= 4
          ? 'linear-gradient(180deg, #fff5c7, #f7c948 45%, #d21f3c 100%)'
          : level >= 3
            ? 'linear-gradient(180deg, #e9fbff, #7be0ff 45%, #2d90d8 100%)'
            : 'linear-gradient(180deg, #d8ebff, #7be0ff 50%, #1d6db7)';
      }

      function setShipPosition() {
        const areaWidth = gameArea.clientWidth;
        ship.style.left = `${Math.min(Math.max(shipX, 26), areaWidth - 26)}px`;
      }

      function spawnEnemy() {
        const enemy = document.createElement('div');
        enemy.className = 'enemy';
        const size = 34;
        const x = Math.random() * (gameArea.clientWidth - size);
        enemy.style.left = `${x}px`;
        enemy.style.top = '0px';
        enemy.dataset.speed = (Math.random() * 1.5 + 1.2).toFixed(2);
        gameArea.appendChild(enemy);
        enemies.push(enemy);
      }

      function launchMissile() {
        if (!gameRunning) return;

        const powerLevel = getPowerLevel();
        const spread = powerLevel >= 3 ? [-10, 0, 10] : [0];
        const missileSpeed = powerLevel >= 4 ? 14 : 10;

        spread.forEach((offset) => {
          const missile = document.createElement('div');
          missile.className = 'missile';
          missile.dataset.speed = String(missileSpeed);
          const shipLeft = ship.offsetLeft + (ship.offsetWidth / 2) + offset;
          missile.style.left = `${shipLeft}px`;
          missile.style.top = `${gameArea.clientHeight - 60}px`;
          missile.style.width = powerLevel >= 4 ? '8px' : '6px';
          missile.style.height = powerLevel >= 4 ? '22px' : '18px';
          if (powerLevel >= 3) {
            missile.style.background = 'linear-gradient(180deg, #ffffff, #7be0ff)';
          }
          gameArea.appendChild(missile);
          missiles.push(missile);
        });
      }

      function makeExplosion(x, y) {
        const burst = document.createElement('div');
        burst.className = 'explosion';
        burst.style.left = `${x}px`;
        burst.style.top = `${y}px`;
        gameArea.appendChild(burst);
        explosions.push(burst);
        setTimeout(() => {
          burst.remove();
          explosions = explosions.filter(item => item !== burst);
        }, 350);
      }

      function updateScoreDisplay() {
        scoreEl.textContent = score;
        livesEl.textContent = lives;
        updateShipPower();
      }

      function resetGame() {
        score = 0;
        lives = 3;
        shipX = gameArea.clientWidth / 2;
        missiles.forEach(m => m.remove());
        enemies.forEach(e => e.remove());
        missiles = [];
        enemies = [];
        setShipPosition();
        updateScoreDisplay();
        messageEl.textContent = 'Game on!';
      }

      function endGame() {
        gameRunning = false;
        messageEl.textContent = `Game over! Final score: ${score}`;
        startButton.textContent = 'Play Again';
      }

      function tick(timestamp) {
        if (!gameRunning) return;

        const delta = (timestamp - lastTime) || 16;
        lastTime = timestamp;

        if (moveLeft) shipX -= 6;
        if (moveRight) shipX += 6;
        setShipPosition();

        if (fireHeld) {
          fireCooldown -= delta;
          if (fireCooldown <= 0) {
            launchMissile();
            fireCooldown = getPowerLevel() >= 4 ? 170 : 220;
          }
        } else {
          fireCooldown = 0;
        }

        enemyTimer += delta;
        const powerLevel = getPowerLevel();
        const enemySpeedBoost = 1 + (powerLevel - 1) * 0.25;
        if (enemyTimer > Math.max(350, 900 - score * 2)) {
          spawnEnemy();
          enemyTimer = 0;
        }

        missiles.forEach((missile) => {
          const speed = Number(missile.dataset.speed || 10);
          const top = (parseFloat(missile.style.top) || 0) - speed * (delta / 16);
          missile.style.top = `${top}px`;
          if (top < -20) {
            missile.remove();
            missiles = missiles.filter(item => item !== missile);
          }
        });

        enemies.forEach((enemy) => {
          const speed = Number(enemy.dataset.speed || 1.5) * enemySpeedBoost;
          const top = enemy.offsetTop + speed * (delta / 16);
          enemy.style.top = `${top}px`;

          if (top > gameArea.clientHeight - 60) {
            enemy.remove();
            enemies = enemies.filter(item => item !== enemy);
            lives -= 1;
            updateScoreDisplay();
            makeExplosion(enemy.offsetLeft, enemy.offsetTop);
            if (lives <= 0) {
              endGame();
            }
          }
        });

        for (let i = missiles.length - 1; i >= 0; i--) {
          const missile = missiles[i];
          const missileY = missile.offsetTop;

          for (let j = enemies.length - 1; j >= 0; j--) {
            const enemy = enemies[j];
            if (!enemy || !missile) continue;

            const hit =
              missile.offsetLeft >= enemy.offsetLeft &&
              missile.offsetLeft <= enemy.offsetLeft + enemy.offsetWidth &&
              missileY <= enemy.offsetTop + enemy.offsetHeight &&
              missileY >= enemy.offsetTop;

            if (hit) {
              missile.remove();
              enemy.remove();
              missiles.splice(i, 1);
              enemies.splice(j, 1);
              score += 10 + (powerLevel - 1) * 5;
              updateScoreDisplay();
              makeExplosion(enemy.offsetLeft, enemy.offsetTop);
              break;
            }
          }
        }

        animationId = requestAnimationFrame(tick);
      }

      function startGame() {
        if (gameRunning) return;
        resetGame();
        gameRunning = true;
        startButton.textContent = 'Running...';
        messageEl.textContent = 'Destroy the enemies!';
        lastTime = performance.now();
        enemyTimer = 0;
        cancelAnimationFrame(animationId);
        animationId = requestAnimationFrame(tick);
      }

      startButton.addEventListener('click', startGame);

      document.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') moveLeft = true;
        if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd') moveRight = true;
        if (event.key === ' ' || event.key === 'ArrowUp') {
          event.preventDefault();
          fireHeld = true;
          if (fireCooldown <= 0) {
            launchMissile();
            fireCooldown = getPowerLevel() >= 4 ? 170 : 220;
          }
        }
      });

      document.addEventListener('keyup', (event) => {
        if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') moveLeft = false;
        if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd') moveRight = false;
        if (event.key === ' ' || event.key === 'ArrowUp') {
          fireHeld = false;
          fireCooldown = 0;
        }
      });

      window.addEventListener('resize', () => {
        shipX = Math.min(Math.max(shipX, 26), gameArea.clientWidth - 26);
        setShipPosition();
      });

      shipX = gameArea.clientWidth / 2;
      setShipPosition();
    </script>
  </body>
</html>
